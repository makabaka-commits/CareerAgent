spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
app:
  persistence:
    mode: jdbc
  rate-limit:
    mode: ${RATE_LIMIT_MODE:redis}
