services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: career_agent
      POSTGRES_USER: career_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_agent_local}
    volumes: ["pg_data:/var/lib/postgresql/data", "./postgres/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U career_agent"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10}
  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/career_agent
      DATABASE_USER: career_agent
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-career_agent_local}
      REDIS_HOST: redis
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-replace-this-before-public-deployment}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4.1-mini}
      OCR_ENABLED: "true"
      OCR_EXECUTABLE: /usr/bin/tesseract
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes: ["resume_data:/app/storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"], interval: 15s, timeout: 5s, retries: 12}
  frontend:
    build: ../frontend
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes: {pg_data: {}, redis_data: {}, resume_data: {}}
